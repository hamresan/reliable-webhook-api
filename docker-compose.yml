services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - webhook_postgres_data:/var/lib/postgresql/data
  
  api:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://webhook:webhook@db:5432/webhook}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-replace-with-local-secret}
      APP_LOGGING_LEVEL: ${APP_LOGGING_LEVEL:-INFO}
      APP_MAX_PAYLOAD_BYTES: ${APP_MAX_PAYLOAD_BYTES:-1048576}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        uv run alembic upgrade head &&
        uv run uvicorn reliable_webhook_api.presentation.api.app:app
        --host 0.0.0.0
        --port 8000

  worker:
    profiles: ["worker"]
    build: .
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+asyncpg://webhook:webhook@db:5432/webhook}
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-replace-with-local-secret}
      APP_LOGGING_LEVEL: ${APP_LOGGING_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "while true; do
             uv run python -m reliable_webhook_api.presentation.cli.retry_worker;
             sleep 5;
             done"

volumes:
  webhook_postgres_data:
