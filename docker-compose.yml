services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webhook
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook -d webhook"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - webhook_postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: development
      APP_DATABASE_URL: postgresql+asyncpg://webhook:webhook@db:5432/webhook
      APP_WEBHOOK_SECRET: ${APP_WEBHOOK_SECRET:-replace-with-local-secret}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn reliable_webhook_api.presentation.api.app:app
             --host 0.0.0.0 --port 8000"

volumes:
  webhook_postgres_data:
